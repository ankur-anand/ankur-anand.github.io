<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Graceful shutdown is an ordered concurrency protocol</title>
  <desc id="desc">Shutdown blocks new calls, cancels shared loads, waits for all workers to stop, and only then closes the cache and backend.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#334455" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#087a51"/>
    </marker>
    <style>
      .title { font: 700 50px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334455; }
      .subtitle { font: 400 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667788; }
      .step { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #334455; }
      .label { font: 700 27px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334455; }
      .small { font: 400 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667788; }
      .number { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .green { fill: #087a51; }
      .red { fill: #d97857; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#f7f7f4"/>
  <text x="64" y="70" class="title">Shutdown is a concurrency protocol</text>
  <text x="64" y="112" class="subtitle">Stop admission, drain shared work, and then close the resources that work can touch.</text>

  <rect x="54" y="146" width="1492" height="624" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <text x="82" y="195" class="step">ADMISSION</text>
  <text x="372" y="195" class="step">ACTIVE WORK</text>
  <text x="952" y="195" class="step">AFTER DRAIN</text>
  <path d="M550 187 H912" stroke="#d9e5df" stroke-width="4"/>
  <path d="M1120 187 H1492" stroke="#d9e5df" stroke-width="4"/>

  <!-- Step 1 -->
  <rect x="82" y="225" width="250" height="300" rx="22" fill="#fffbea" stroke="#e2c84e" stroke-width="2"/>
  <circle cx="116" cy="261" r="23" fill="#334455"/>
  <text x="116" y="269" class="number" text-anchor="middle">1</text>
  <text x="153" y="271" class="step">GATE</text>
  <path d="M139 350 H275" stroke="#334455" stroke-width="7" stroke-linecap="round"/>
  <path d="M181 318 V402 M233 318 V402" stroke="#d97857" stroke-width="8" stroke-linecap="round"/>
  <text x="207" y="458" class="label" text-anchor="middle">Reject new calls</text>
  <text x="207" y="492" class="small" text-anchor="middle">Do returns closeErr</text>

  <!-- Step 2 -->
  <rect x="372" y="225" width="250" height="300" rx="22" fill="#f9ece7" stroke="#e3a08a" stroke-width="2"/>
  <circle cx="406" cy="261" r="23" fill="#d97857"/>
  <text x="406" y="269" class="number" text-anchor="middle">2</text>
  <text x="443" y="271" class="step red">CANCEL</text>
  <circle cx="497" cy="360" r="57" fill="#ffffff" stroke="#d97857" stroke-width="5"/>
  <path d="M472 335 L522 385 M522 335 L472 385" stroke="#d97857" stroke-width="8" stroke-linecap="round"/>
  <text x="497" y="458" class="label" text-anchor="middle">Signal workers</text>
  <text x="497" y="492" class="small" text-anchor="middle">cancel(call.ctx)</text>

  <!-- Step 3 -->
  <rect x="662" y="225" width="250" height="300" rx="22" fill="#e6f5ec" stroke="#5bcf80" stroke-width="2"/>
  <circle cx="696" cy="261" r="23" fill="#087a51"/>
  <text x="696" y="269" class="number" text-anchor="middle">3</text>
  <text x="733" y="271" class="step green">WAIT</text>
  <circle cx="787" cy="360" r="57" fill="#ffffff" stroke="#087a51" stroke-width="5"/>
  <path d="M787 360 V324 M787 360 L819 379" stroke="#087a51" stroke-width="7" stroke-linecap="round"/>
  <text x="787" y="458" class="label" text-anchor="middle">Drain workers</text>
  <text x="787" y="492" class="small" text-anchor="middle">active reaches zero</text>

  <!-- Step 4 -->
  <rect x="952" y="225" width="250" height="300" rx="22" fill="#eef2f3" stroke="#cad4d7" stroke-width="2"/>
  <circle cx="986" cy="261" r="23" fill="#334455"/>
  <text x="986" y="269" class="number" text-anchor="middle">4</text>
  <text x="1023" y="271" class="step">CACHE</text>
  <rect x="1019" y="318" width="116" height="88" rx="15" fill="#ffffff" stroke="#667788" stroke-width="3"/>
  <path d="M1040 340 H1114 M1040 362 H1114 M1040 384 H1094" stroke="#667788" stroke-width="5" stroke-linecap="round"/>
  <text x="1077" y="458" class="label" text-anchor="middle">Close cache</text>
  <text x="1077" y="492" class="small" text-anchor="middle">no late stores</text>

  <!-- Step 5 -->
  <rect x="1242" y="225" width="250" height="300" rx="22" fill="#eef2f3" stroke="#cad4d7" stroke-width="2"/>
  <circle cx="1276" cy="261" r="23" fill="#334455"/>
  <text x="1276" y="269" class="number" text-anchor="middle">5</text>
  <text x="1313" y="271" class="step">BACKEND</text>
  <ellipse cx="1367" cy="335" rx="61" ry="21" fill="#ffffff" stroke="#667788" stroke-width="3"/>
  <path d="M1306 335 V391 C1306 403 1333 413 1367 413 C1401 413 1428 403 1428 391 V335" fill="#ffffff" stroke="#667788" stroke-width="3"/>
  <path d="M1306 363 C1306 375 1333 385 1367 385 C1401 385 1428 375 1428 363" fill="none" stroke="#667788" stroke-width="3"/>
  <text x="1367" y="458" class="label" text-anchor="middle">Close backend</text>
  <text x="1367" y="492" class="small" text-anchor="middle">resources are idle</text>

  <!-- Fixed-size arrows centered in the gaps -->
  <path d="M340 375 H362" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M630 375 H652" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M920 375 H942" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow-green)"/>
  <path d="M1210 375 H1232" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow-green)"/>

  <rect x="82" y="565" width="1410" height="150" rx="22" fill="#e6f5ec"/>
  <text x="787" y="612" class="label green" text-anchor="middle">Workers must reach zero before resources close</text>
  <text x="787" y="652" class="small" text-anchor="middle">Otherwise a late load can write into cache or backend state that has already been closed.</text>
  <rect x="410" y="670" width="754" height="32" rx="10" fill="#fff7df"/>
  <text x="787" y="694" class="small" text-anchor="middle">The load function must observe call.ctx, or the drain cannot finish.</text>
</svg>
