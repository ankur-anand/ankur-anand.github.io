<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From cache stampede to one flight</title>
  <desc id="desc">The left panel shows six callers missing the cache and starting six backend requests. The right panel shows the same callers joining one keyed singleflight call, which starts one backend request.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263746" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#d97857"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#087a51"/>
    </marker>
    <style>
      text { font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif; fill: #334455; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
      .label { font-size: 24px; font-weight: 650; }
      .small { font-size: 20px; fill: #6a7686; }
      .caller { font-size: 18px; font-weight: 650; }
      .inverse { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f7f4"/>
  <text x="64" y="78" font-size="46" font-weight="750" letter-spacing="-1.2">A cache cannot see work in progress</text>
  <text x="64" y="118" class="small">The cache is correct in both cases. The difference is whether misses are coordinated by key.</text>

  <rect x="54" y="164" width="724" height="678" rx="28" fill="#ffffff" stroke="#e1e7e7" filter="url(#shadow)"/>
  <rect x="822" y="164" width="724" height="678" rx="28" fill="#ffffff" stroke="#d4e8df" filter="url(#shadow)"/>

  <text x="92" y="216" class="eyebrow" fill="#b65f43">WITHOUT COALESCING</text>
  <text x="860" y="216" class="eyebrow" fill="#087a51">WITH SINGLEFLIGHT</text>

  <text x="92" y="264" class="small">CALLERS</text>
  <text x="354" y="264" class="small">CACHE</text>
  <text x="592" y="264" class="small">BACKEND</text>

  <g>
    <rect x="92" y="290" width="122" height="52" rx="14" fill="#edf1f2"/><text x="153" y="323" text-anchor="middle" class="caller">G1</text>
    <rect x="92" y="365" width="122" height="52" rx="14" fill="#edf1f2"/><text x="153" y="398" text-anchor="middle" class="caller">G2</text>
    <rect x="92" y="440" width="122" height="52" rx="14" fill="#edf1f2"/><text x="153" y="473" text-anchor="middle" class="caller">G3</text>
    <rect x="92" y="515" width="122" height="52" rx="14" fill="#edf1f2"/><text x="153" y="548" text-anchor="middle" class="caller">G4</text>
    <rect x="92" y="590" width="122" height="52" rx="14" fill="#edf1f2"/><text x="153" y="623" text-anchor="middle" class="caller">G5</text>
    <rect x="92" y="665" width="122" height="52" rx="14" fill="#edf1f2"/><text x="153" y="698" text-anchor="middle" class="caller">G6</text>
  </g>

  <rect x="334" y="290" width="154" height="427" rx="20" fill="#fffbea" stroke="#e7dd67" stroke-width="2"/>
  <text x="411" y="469" text-anchor="middle" class="label">MISS</text>
  <text x="411" y="503" text-anchor="middle" class="small">× 6</text>
  <text x="411" y="543" text-anchor="middle" font-size="18" fill="#6a7686">nothing stored yet</text>

  <rect x="586" y="290" width="154" height="427" rx="20" fill="#f9ece7" stroke="#e3a08a" stroke-width="2"/>
  <text x="663" y="469" text-anchor="middle" class="label">FETCH</text>
  <text x="663" y="503" text-anchor="middle" class="small">× 6</text>
  <text x="663" y="543" text-anchor="middle" font-size="18" fill="#6a7686">same key</text>

  <g fill="none" stroke="#d97857" stroke-width="4" marker-end="url(#arrow-red)">
    <path d="M214 316 H326"/><path d="M214 391 H326"/><path d="M214 466 H326"/>
    <path d="M214 541 H326"/><path d="M214 616 H326"/><path d="M214 691 H326"/>
    <path d="M488 316 H578"/><path d="M488 391 H578"/><path d="M488 466 H578"/>
    <path d="M488 541 H578"/><path d="M488 616 H578"/><path d="M488 691 H578"/>
  </g>
  <rect x="92" y="760" width="648" height="52" rx="16" fill="#f9ece7"/>
  <text x="416" y="794" text-anchor="middle" font-size="23" font-weight="700" fill="#b65f43">6 misses → 6 identical fetches</text>

  <text x="860" y="264" class="small">CALLERS</text>
  <text x="1118" y="264" class="small">KEYED FLIGHT</text>
  <text x="1390" y="264" class="small">BACKEND</text>

  <g>
    <rect x="860" y="290" width="122" height="52" rx="14" fill="#edf1f2"/><text x="921" y="323" text-anchor="middle" class="caller">G1</text>
    <rect x="860" y="365" width="122" height="52" rx="14" fill="#edf1f2"/><text x="921" y="398" text-anchor="middle" class="caller">G2</text>
    <rect x="860" y="440" width="122" height="52" rx="14" fill="#edf1f2"/><text x="921" y="473" text-anchor="middle" class="caller">G3</text>
    <rect x="860" y="515" width="122" height="52" rx="14" fill="#edf1f2"/><text x="921" y="548" text-anchor="middle" class="caller">G4</text>
    <rect x="860" y="590" width="122" height="52" rx="14" fill="#edf1f2"/><text x="921" y="623" text-anchor="middle" class="caller">G5</text>
    <rect x="860" y="665" width="122" height="52" rx="14" fill="#edf1f2"/><text x="921" y="698" text-anchor="middle" class="caller">G6</text>
  </g>

  <rect x="1108" y="290" width="194" height="427" rx="20" fill="#e6f5ec" stroke="#5bcf80" stroke-width="3"/>
  <text x="1205" y="446" text-anchor="middle" class="label">homepage</text>
  <text x="1205" y="483" text-anchor="middle" class="small">one running call</text>
  <rect x="1150" y="515" width="110" height="42" rx="21" fill="#087a51"/>
  <text x="1205" y="543" text-anchor="middle" font-size="18" font-weight="700" class="inverse">6 waiters</text>

  <rect x="1380" y="410" width="128" height="188" rx="20" fill="#e6f5ec" stroke="#5bcf80" stroke-width="3"/>
  <text x="1444" y="489" text-anchor="middle" class="label">FETCH</text>
  <text x="1444" y="524" text-anchor="middle" class="small">× 1</text>

  <g fill="none" stroke="#087a51" stroke-width="4" marker-end="url(#arrow-green)">
    <path d="M982 316 H1100"/><path d="M982 391 H1100"/><path d="M982 466 H1100"/>
    <path d="M982 541 H1100"/><path d="M982 616 H1100"/><path d="M982 691 H1100"/>
    <path d="M1302 504 H1370"/>
  </g>
  <rect x="860" y="760" width="648" height="52" rx="16" fill="#e6f5ec"/>
  <text x="1184" y="794" text-anchor="middle" font-size="23" font-weight="700" fill="#087a51">6 misses → 1 shared fetch</text>
</svg>
