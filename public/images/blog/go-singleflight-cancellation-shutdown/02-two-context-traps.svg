<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Two context traps in a singleflight call</title>
  <desc id="desc">In the first panel the leader times out and cancels the shared backend fetch for a follower. In the second panel a follower times out but remains blocked inside Do until the leader finishes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#263746" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-dark" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 18 9 0 18Z" fill="#334455"/>
    </marker>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 18 9 0 18Z" fill="#087a51"/>
    </marker>
    <marker id="arrow-red" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 18 9 0 18Z" fill="#d97857"/>
    </marker>
    <style>
      text { font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif; fill: #334455; }
      .eyebrow { font-size: 24px; font-weight: 750; letter-spacing: 2px; }
      .label { font-size: 28px; font-weight: 700; }
      .small { font-size: 24px; fill: #6a7686; }
      .meta { font-size: 24px; fill: #6a7686; }
      .red { fill: #b65f43; }
      .green { fill: #087a51; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#f7f7f4"/>
  <text x="64" y="70" font-size="50" font-weight="750" letter-spacing="-1.2">One captured context, two failure modes</text>
  <text x="64" y="112" class="small">The leader controls the function. A follower controls neither the function nor a blocking Do wait.</text>

  <rect x="54" y="146" width="724" height="624" rx="28" fill="#ffffff" stroke="#e1e7e7" filter="url(#shadow)"/>
  <rect x="822" y="146" width="724" height="624" rx="28" fill="#ffffff" stroke="#e1e7e7" filter="url(#shadow)"/>

  <text x="96" y="198" class="eyebrow red">LEADER CANCELS</text>
  <text x="96" y="238" class="small">A has 50 ms. B still has 1.95 s.</text>

  <rect x="96" y="286" width="190" height="92" rx="18" fill="#fffbea" stroke="#e7dd67" stroke-width="2"/>
  <text x="191" y="324" text-anchor="middle" class="label">Caller A</text>
  <text x="191" y="357" text-anchor="middle" class="meta">leader · 50 ms</text>

  <rect x="96" y="446" width="190" height="92" rx="18" fill="#edf1f2"/>
  <text x="191" y="484" text-anchor="middle" class="label">Caller B</text>
  <text x="191" y="517" text-anchor="middle" class="meta">follower · 2 s</text>

  <rect x="370" y="330" width="212" height="180" rx="22" fill="#e6f5ec" stroke="#5bcf80" stroke-width="3"/>
  <text x="476" y="391" text-anchor="middle" class="label">shared call</text>
  <text x="476" y="443" text-anchor="middle" class="small">uses ctx A</text>

  <rect x="634" y="330" width="116" height="180" rx="22" fill="#f9ece7" stroke="#d97857" stroke-width="3"/>
  <text x="692" y="405" text-anchor="middle" class="label">fetch</text>
  <text x="692" y="445" text-anchor="middle" class="small">100 ms</text>

  <path d="M300 332 C330 332 334 374 354 392" fill="none" stroke="#334455" stroke-width="5" marker-end="url(#arrow-dark)"/>
  <path d="M300 492 C330 492 334 466 354 448" fill="none" stroke="#334455" stroke-width="5" marker-end="url(#arrow-dark)"/>
  <path d="M594 420 H620" fill="none" stroke="#334455" stroke-width="5" marker-end="url(#arrow-dark)"/>

  <path d="M124 392 C124 410 76 410 76 438 V606 H692 V524" fill="none" stroke="#d97857" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#arrow-red)"/>
  <circle cx="76" cy="606" r="27" fill="#d97857"/>
  <path d="M64 594 88 618M88 594 64 618" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <text x="108" y="665" class="label red">A's deadline cancels the shared fetch</text>
  <text x="108" y="704" class="small">Both A and B receive the cancellation error.</text>

  <text x="860" y="198" class="eyebrow red">FOLLOWER CANCELS</text>
  <text x="860" y="238" class="small">B has 50 ms. A's fetch takes 10 s.</text>

  <line x1="908" y1="306" x2="1492" y2="306" stroke="#cbd4d7" stroke-width="5"/>
  <circle cx="932" cy="306" r="11" fill="#087a51"/>
  <circle cx="1148" cy="306" r="11" fill="#d97857"/>
  <circle cx="1462" cy="306" r="11" fill="#087a51"/>
  <text x="932" y="278" text-anchor="middle" class="meta">0 ms</text>
  <text x="1148" y="278" text-anchor="middle" class="meta">50 ms</text>
  <text x="1462" y="278" text-anchor="middle" class="meta">10 s</text>

  <rect x="860" y="350" width="190" height="92" rx="18" fill="#e6f5ec" stroke="#5bcf80" stroke-width="2"/>
  <text x="955" y="388" text-anchor="middle" class="label">Caller A</text>
  <text x="955" y="421" text-anchor="middle" class="meta">leader</text>
  <path d="M1064 396 H1442" fill="none" stroke="#087a51" stroke-width="7" marker-end="url(#arrow-green)"/>
  <text x="1250" y="378" text-anchor="middle" class="meta green">fetch runs for 10 s</text>

  <rect x="860" y="500" width="190" height="92" rx="18" fill="#edf1f2"/>
  <text x="955" y="538" text-anchor="middle" class="label">Caller B</text>
  <text x="955" y="571" text-anchor="middle" class="meta">follower</text>
  <path d="M1064 546 H1442" fill="none" stroke="#6a7686" stroke-width="7" marker-end="url(#arrow-dark)"/>
  <circle cx="1148" cy="546" r="27" fill="#d97857"/>
  <path d="M1136 534 1160 558M1160 534 1136 558" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <text x="1148" y="614" text-anchor="middle" class="meta red">B's context ends</text>
  <text x="1352" y="614" text-anchor="middle" class="meta">Do keeps waiting</text>

  <rect x="860" y="650" width="648" height="84" rx="18" fill="#f9ece7"/>
  <text x="1184" y="685" text-anchor="middle" class="label red">B cannot abandon a blocking Do wait</text>
  <text x="1184" y="716" text-anchor="middle" class="meta">It returns only after A's function completes.</text>
</svg>
