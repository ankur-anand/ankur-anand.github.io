<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">A newer catalog epoch fences the old writer</title>
  <desc id="desc">Writer A owns epoch 4. Writer B conditionally advances the catalog head to epoch 5. A late segment from A remains an unreachable orphan because its epoch and writer identity no longer match the head.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#334455" flood-opacity="0.12"/></filter>
    <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 18 9 0 18Z" fill="#087a51"/></marker>
    <marker id="arrow-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 18 9 0 18Z" fill="#d97857"/></marker>
    <style>.title{font:700 49px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.subtitle{font:400 23px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}.eye{font:700 19px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.3px;fill:#334455}.label{font:700 27px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.meta{font:400 20px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}.mono{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334455}.small{font:600 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.white{fill:#fff}.pale{fill:#d9e2e7}</style>
  </defs>
  <rect width="1600" height="860" fill="#f7f7f4"/>
  <text x="64" y="70" class="title">The newer epoch owns the next LSN</text>
  <text x="64" y="112" class="subtitle">A stale process may finish an upload; it cannot publish behind the replacement writer.</text>
  <rect x="54" y="148" width="1492" height="650" rx="28" fill="#fff" filter="url(#shadow)"/>

  <text x="86" y="198" class="eye">1 · WRITER A OPENS</text>
  <rect x="86" y="230" width="420" height="178" rx="22" fill="#fff7e8" stroke="#e2c84e" stroke-width="3"/>
  <text x="296" y="282" class="label" text-anchor="middle">Writer A</text>
  <text x="296" y="325" class="mono" text-anchor="middle">epoch=4 · writer_id=A</text>
  <text x="296" y="365" class="meta" text-anchor="middle">prepares segment at LSN 100</text>
  <path d="M506 319H590" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow-green)"/>
  <rect x="616" y="230" width="386" height="178" rx="22" fill="#334455"/>
  <text x="809" y="282" class="label white" text-anchor="middle">head.plc</text>
  <text x="809" y="325" class="mono pale" text-anchor="middle">epoch=4 · writer=A</text>
  <text x="809" y="365" class="mono pale" text-anchor="middle">next_lsn=100</text>

  <text x="1082" y="198" class="eye">2 · WRITER B TAKES OVER</text>
  <rect x="1082" y="230" width="430" height="178" rx="22" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="1297" y="282" class="label" text-anchor="middle">Writer B wins CAS</text>
  <text x="1297" y="325" class="mono" text-anchor="middle">epoch=5 · writer_id=B</text>
  <text x="1297" y="365" class="meta" text-anchor="middle">same next LSN, newer fence</text>
  <path d="M1082 319H1028" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow-green)"/>

  <line x1="86" y1="458" x2="1512" y2="458" stroke="#d7e0e3" stroke-width="3"/>
  <text x="86" y="504" class="eye">3 · BOTH SEGMENTS MAY REACH THE BUCKET</text>
  <rect x="86" y="536" width="480" height="148" rx="20" fill="#fff2ed" stroke="#d97857" stroke-width="3"/>
  <text x="326" y="580" class="label" text-anchor="middle">Late segment from A</text>
  <text x="326" y="620" class="mono" text-anchor="middle">base=100 · epoch=4 · tag=A</text>
  <text x="326" y="655" class="meta" text-anchor="middle">durable object, stale identity</text>
  <path d="M566 610H680" fill="none" stroke="#d97857" stroke-width="5" stroke-dasharray="11 9" marker-end="url(#arrow-orange)"/>
  <circle cx="718" cy="610" r="31" fill="#d97857"/><path d="M704 596l28 28M732 596l-28 28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="718" y="665" class="meta" text-anchor="middle">rejected</text>

  <rect x="1032" y="536" width="480" height="148" rx="20" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="1272" y="580" class="label" text-anchor="middle">Segment from B</text>
  <text x="1272" y="620" class="mono" text-anchor="middle">base=100 · epoch=5 · tag=B</text>
  <text x="1272" y="655" class="meta" text-anchor="middle">matches the current head</text>
  <path d="M1032 610H918" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow-green)"/>
  <circle cx="880" cy="610" r="31" fill="#087a51"/><path d="M865 610l11 11 22-26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="880" y="665" class="meta" text-anchor="middle">publish</text>

  <rect x="86" y="724" width="1426" height="50" rx="14" fill="#dff3e7"/>
  <text x="799" y="756" class="small" text-anchor="middle">The application decides when to replace a writer; the catalog makes replacement safe.</text>
</svg>
