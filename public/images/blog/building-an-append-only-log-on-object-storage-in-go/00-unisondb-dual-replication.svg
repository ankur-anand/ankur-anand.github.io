<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One committed UnisonDB WAL feeds two replication paths</title>
  <desc id="desc">The active UnisonDB HA writer exposes the same committed WAL through two replica transports: a direct gRPC stream and immutable segments in object storage that a replica can poll without connecting to the writer.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#334455" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGreen" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 18 9 0 18Z" fill="#087a51"/>
    </marker>
    <marker id="arrowNavy" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 18 9 0 18Z" fill="#334455"/>
    </marker>
    <style>
      .title{font:700 49px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}
      .subtitle{font:400 23px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}
      .eye{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.2px;fill:#334455}
      .label{font:700 26px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}
      .meta{font:400 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}
      .small{font:600 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}
      .mono{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334455}
      .white{fill:#fff}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f7f4"/>
  <text x="64" y="70" class="title">One committed WAL, two replication paths</text>
  <text x="64" y="112" class="subtitle">Replicas either stay connected over gRPC or poll the same committed WAL from object storage.</text>
  <rect x="54" y="148" width="1492" height="686" rx="28" fill="#fff" filter="url(#shadow)"/>

  <text x="84" y="198" class="eye">SOURCE OF ORDER</text>
  <rect x="84" y="228" width="354" height="486" rx="24" fill="#eef3f5" stroke="#c8d2d7" stroke-width="3"/>
  <circle cx="261" cy="286" r="38" fill="#334455"/>
  <path d="M244 286H278M261 269V303" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="261" y="350" class="label" text-anchor="middle">UnisonDB HA writer</text>
  <text x="261" y="384" class="meta" text-anchor="middle">active writer after consensus</text>
  <rect x="124" y="426" width="274" height="150" rx="18" fill="#334455"/>
  <text x="261" y="468" class="label white" text-anchor="middle">committed WAL</text>
  <text x="261" y="510" class="mono white" text-anchor="middle">LSN 8,249</text>
  <text x="261" y="541" class="mono white" text-anchor="middle">LSN 8,250</text>
  <text x="261" y="620" class="small" text-anchor="middle">one order · one commit point</text>
  <text x="261" y="651" class="meta" text-anchor="middle">both paths copy committed records</text>

  <text x="546" y="198" class="eye">DIRECT gRPC PATH</text>
  <path d="M438 356H500V306H546" fill="none" stroke="#334455" stroke-width="5" marker-end="url(#arrowNavy)"/>
  <rect x="546" y="228" width="344" height="194" rx="22" fill="#eef3f5" stroke="#9baaba" stroke-width="3"/>
  <text x="718" y="282" class="label" text-anchor="middle">gRPC streamer</text>
  <rect x="596" y="310" width="244" height="54" rx="12" fill="#fff" stroke="#c8d2d7" stroke-width="2"/>
  <text x="718" y="344" class="mono" text-anchor="middle">ordered WAL batches</text>
  <text x="718" y="395" class="meta" text-anchor="middle">low-latency · connected</text>
  <path d="M890 325H1016" fill="none" stroke="#334455" stroke-width="5" marker-end="url(#arrowNavy)"/>
  <rect x="1016" y="228" width="470" height="194" rx="22" fill="#eef3f5" stroke="#9baaba" stroke-width="3"/>
  <text x="1251" y="282" class="label" text-anchor="middle">gRPC-connected replica</text>
  <text x="1251" y="327" class="mono" text-anchor="middle">receive → validate → apply</text>
  <text x="1251" y="370" class="meta" text-anchor="middle">maintains a direct connection to the writer</text>

  <text x="546" y="478" class="eye">OBJECT-STORAGE PATH</text>
  <path d="M438 540H500V590H546" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="546" y="506" width="344" height="208" rx="22" fill="#e9f8ef" stroke="#4fcf7d" stroke-width="3"/>
  <text x="718" y="560" class="label" text-anchor="middle">objlog publisher</text>
  <rect x="590" y="586" width="256" height="58" rx="12" fill="#fff" stroke="#4fcf7d" stroke-width="2"/>
  <text x="718" y="622" class="mono" text-anchor="middle">batch · seal · publish</text>
  <text x="718" y="685" class="meta" text-anchor="middle">immutable · independently replayable</text>
  <path d="M890 610H920" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrowGreen)"/>

  <rect x="920" y="500" width="220" height="222" rx="24" fill="#eef3f5" stroke="#9fcdb3" stroke-width="3"/>
  <ellipse cx="1030" cy="542" rx="84" ry="28" fill="#fff" stroke="#78899c" stroke-width="3"/>
  <path d="M946 542V661C946 677 984 690 1030 690S1114 677 1114 661V542" fill="none" stroke="#78899c" stroke-width="3"/>
  <text x="1030" y="550" class="small" text-anchor="middle">object storage</text>
  <rect x="957" y="580" width="146" height="44" rx="10" fill="#334455"/>
  <text x="1030" y="609" class="small white" text-anchor="middle">bounded catalog</text>
  <rect x="957" y="638" width="42" height="28" rx="7" fill="#fff7e8" stroke="#e2c84e" stroke-width="2"/>
  <rect x="1009" y="638" width="42" height="28" rx="7" fill="#fff7e8" stroke="#e2c84e" stroke-width="2"/>
  <rect x="1061" y="638" width="42" height="28" rx="7" fill="#fff7e8" stroke="#e2c84e" stroke-width="2"/>

  <path d="M1140 610H1210" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="1210" y="500" width="276" height="222" rx="24" fill="#e9f8ef" stroke="#4fcf7d" stroke-width="3"/>
  <text x="1348" y="550" class="label" text-anchor="middle">Object-store replica</text>
  <rect x="1240" y="570" width="216" height="100" rx="13" fill="#fff" stroke="#4fcf7d" stroke-width="2"/>
  <text x="1348" y="598" class="mono" text-anchor="middle">poll catalog</text>
  <text x="1348" y="628" class="mono" text-anchor="middle">fetch ranges</text>
  <text x="1348" y="658" class="mono" text-anchor="middle">validate → apply</text>
  <text x="1348" y="700" class="meta" text-anchor="middle">catch up · replay · tail</text>

  <rect x="84" y="762" width="1402" height="44" rx="12" fill="#dff3e7"/>
  <text x="785" y="791" class="small" text-anchor="middle">Both replicas apply the same committed order; the object-store replica never connects to the writer.</text>
</svg>
