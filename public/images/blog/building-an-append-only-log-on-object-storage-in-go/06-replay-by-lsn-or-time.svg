<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Replay by LSN or timestamp</title>
  <desc id="desc">An LSN or timestamp query descends the catalog to a candidate segment, reads its trailer and block index, selects a compressed block, then decodes records beginning at the requested position.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#334455" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 18 9 0 18Z" fill="#087a51"/></marker>
    <style>.title{font:700 49px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.subtitle{font:400 23px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}.eye{font:700 19px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.3px;fill:#334455}.label{font:700 25px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.meta{font:400 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}.mono{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334455}.small{font:600 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.white{fill:#fff}.pale{fill:#d9e2e7}</style>
  </defs>
  <rect width="1600" height="900" fill="#f7f7f4"/>
  <text x="64" y="70" class="title">Replay narrows the search twice</text>
  <text x="64" y="112" class="subtitle">The catalog selects one object; the segment index selects one block inside it.</text>
  <rect x="54" y="148" width="1492" height="690" rx="28" fill="#fff" filter="url(#shadow)"/>

  <text x="84" y="198" class="eye">QUERY</text>
  <rect x="84" y="238" width="290" height="132" rx="20" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="229" y="281" class="label" text-anchor="middle">Replay by LSN</text>
  <text x="229" y="326" class="mono" text-anchor="middle">start_lsn = 8,250</text>
  <rect x="84" y="398" width="290" height="132" rx="20" fill="#fff2ed" stroke="#d97857" stroke-width="3"/>
  <text x="229" y="441" class="label" text-anchor="middle">Replay by time</text>
  <text x="229" y="486" class="mono" text-anchor="middle">timestamp_ms = T</text>
  <path d="M374 304H426V383H478" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M374 464H426V383H478" fill="none" stroke="#087a51" stroke-width="5"/>

  <text x="504" y="198" class="eye">1 · CATALOG SEARCH</text>
  <rect x="504" y="238" width="332" height="292" rx="22" fill="#eef3f5" stroke="#c8d2d7" stroke-width="3"/>
  <rect x="544" y="276" width="252" height="62" rx="13" fill="#334455"/>
  <text x="670" y="315" class="mono pale" text-anchor="middle">head.plc</text>
  <path d="M670 338V370" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="544" y="388" width="252" height="62" rx="13" fill="#fff7e8" stroke="#e2c84e" stroke-width="2"/>
  <text x="670" y="427" class="mono" text-anchor="middle">index page(s)</text>
  <path d="M670 450V480" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="670" y="516" class="meta" text-anchor="middle">select segment range</text>
  <path d="M836 383H894" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="920" y="198" class="eye">2 · SEGMENT SEARCH</text>
  <rect x="920" y="238" width="332" height="292" rx="22" fill="#fff7e8" stroke="#e2c84e" stroke-width="3"/>
  <rect x="960" y="276" width="252" height="62" rx="13" fill="#fff2ed" stroke="#d97857" stroke-width="2"/>
  <text x="1086" y="315" class="mono" text-anchor="middle">read final trailer</text>
  <path d="M1086 338V370" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="960" y="388" width="252" height="62" rx="13" fill="#fff" stroke="#e2c84e" stroke-width="2"/>
  <text x="1086" y="427" class="mono" text-anchor="middle">read block index</text>
  <path d="M1086 450V480" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1086" y="516" class="meta" text-anchor="middle">select block range</text>
  <path d="M1252 383H1310" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="1336" y="198" class="eye">3 · DECODE</text>
  <rect x="1336" y="238" width="176" height="292" rx="22" fill="#334455"/>
  <rect x="1362" y="276" width="124" height="88" rx="12" fill="#087a51"/>
  <text x="1424" y="315" class="label white" text-anchor="middle">Block</text>
  <text x="1424" y="345" class="meta pale" text-anchor="middle">range GET</text>
  <text x="1424" y="411" class="meta pale" text-anchor="middle">verify</text>
  <text x="1424" y="445" class="meta pale" text-anchor="middle">decompress</text>
  <text x="1424" y="479" class="meta pale" text-anchor="middle">scan records</text>

  <line x1="84" y1="582" x2="1512" y2="582" stroke="#d7e0e3" stroke-width="3"/>
  <text x="84" y="627" class="eye">ORDERED SEARCH KEYS</text>
  <rect x="84" y="654" width="684" height="112" rx="18" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="120" y="695" class="label">LSN path</text>
  <text x="120" y="735" class="mono">page seq_hi >= LSN → block last_lsn >= LSN</text>
  <rect x="828" y="654" width="684" height="112" rx="18" fill="#fff2ed" stroke="#d97857" stroke-width="3"/>
  <text x="864" y="695" class="label">Timestamp path</text>
  <text x="864" y="735" class="mono">page max_time >= T → block max_time >= T</text>

  <rect x="84" y="792" width="1428" height="26" rx="8" fill="#dff3e7"/>
  <text x="798" y="813" class="small" text-anchor="middle">Readers never contact the writer.</text>
</svg>
