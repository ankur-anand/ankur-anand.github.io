<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">A bounded head over immutable catalog pages</title>
  <desc id="desc">The catalog head stores current segment entries and the incomplete frontier at each index level. Full groups of 128 entries become immutable leaf or index pages, so history grows outside the mutable head.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#334455" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 18 9 0 18Z" fill="#087a51"/></marker>
    <style>.title{font:700 49px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.subtitle{font:400 23px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}.eye{font:700 19px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.3px;fill:#334455}.label{font:700 25px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.meta{font:400 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}.mono{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334455}.small{font:600 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.white{fill:#fff}.pale{fill:#d9e2e7}</style>
  </defs>
  <rect width="1600" height="940" fill="#f7f7f4"/>
  <text x="64" y="70" class="title">History grows; the mutable head stays bounded</text>
  <text x="64" y="112" class="subtitle">Full groups become immutable pages. The head keeps only hot state and the incomplete right edge.</text>
  <rect x="54" y="148" width="1492" height="730" rx="28" fill="#fff" filter="url(#shadow)"/>

  <text x="84" y="198" class="eye">MUTABLE COMMIT RECORD</text>
  <rect x="84" y="228" width="530" height="530" rx="24" fill="#334455"/>
  <text x="349" y="282" class="label white" text-anchor="middle">head.plc</text>
  <text x="349" y="316" class="meta pale" text-anchor="middle">replaced with compare-and-swap</text>
  <rect x="124" y="350" width="450" height="92" rx="15" fill="#45586a"/>
  <text x="151" y="384" class="mono pale">partition state</text>
  <text x="151" y="416" class="meta pale">next LSN · oldest LSN · epoch · generation</text>
  <rect x="124" y="464" width="450" height="92" rx="15" fill="#45586a"/>
  <text x="151" y="498" class="mono pale">open leaf</text>
  <text x="151" y="530" class="meta pale">current segment refs · fewer than 128</text>
  <rect x="124" y="578" width="450" height="140" rx="15" fill="#45586a"/>
  <text x="151" y="612" class="mono pale">open index frontier</text>
  <text x="151" y="646" class="meta pale">level 1 refs · fewer than 128</text>
  <text x="151" y="678" class="meta pale">level 2 refs · fewer than 128</text>
  <text x="151" y="710" class="meta pale">... bounded level count</text>

  <path d="M614 510H700" fill="none" stroke="#087a51" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="657" y="486" class="meta" text-anchor="middle">roots</text>

  <text x="730" y="198" class="eye">IMMUTABLE HISTORY</text>
  <rect x="730" y="228" width="782" height="530" rx="24" fill="#f5f8f7" stroke="#c8d2d7" stroke-width="3"/>
  <rect x="980" y="266" width="282" height="78" rx="15" fill="#fff2ed" stroke="#d97857" stroke-width="3"/>
  <text x="1121" y="300" class="label" text-anchor="middle">Level 2 index page</text>
  <text x="1121" y="329" class="meta" text-anchor="middle">up to 128 level-1 refs</text>

  <path d="M1054 344V390H878V416" fill="none" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1188 344V390H1364V416" fill="none" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="760" y="432" width="282" height="78" rx="15" fill="#fff7e8" stroke="#e2c84e" stroke-width="3"/>
  <text x="901" y="466" class="label" text-anchor="middle">Level 1 index page</text>
  <text x="901" y="495" class="meta" text-anchor="middle">up to 128 leaf refs</text>
  <rect x="1200" y="432" width="282" height="78" rx="15" fill="#fff7e8" stroke="#e2c84e" stroke-width="3"/>
  <text x="1341" y="466" class="label" text-anchor="middle">Level 1 index page</text>
  <text x="1341" y="495" class="meta" text-anchor="middle">up to 128 leaf refs</text>

  <path d="M843 510V556H793V582" fill="none" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M959 510V556H1034V582" fill="none" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1283 510V556H1242V582" fill="none" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1399 510V556H1452V582" fill="none" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="748" y="598" width="190" height="88" rx="14" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="843" y="636" class="label" text-anchor="middle">Leaf page</text><text x="843" y="669" class="meta" text-anchor="middle">128 segments</text>
  <rect x="956" y="598" width="190" height="88" rx="14" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="1051" y="636" class="label" text-anchor="middle">Leaf page</text><text x="1051" y="669" class="meta" text-anchor="middle">128 segments</text>
  <rect x="1164" y="598" width="190" height="88" rx="14" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="1259" y="636" class="label" text-anchor="middle">Leaf page</text><text x="1259" y="669" class="meta" text-anchor="middle">128 segments</text>
  <rect x="1372" y="598" width="110" height="88" rx="14" fill="#eef3f5" stroke="#c8d2d7" stroke-width="3"/>
  <text x="1427" y="651" class="label" text-anchor="middle">…</text>
  <text x="1121" y="728" class="mono" text-anchor="middle">complete pages are written once</text>

  <rect x="84" y="798" width="1428" height="52" rx="14" fill="#dff3e7"/>
  <text x="798" y="831" class="small" text-anchor="middle">Filling 128 entries carries one reference upward—like a base-128 counter.</text>
</svg>
