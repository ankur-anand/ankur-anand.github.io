<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
  <title id="title">Retention changes reachability before garbage collection deletes objects</title>
  <desc id="desc">A retention request records intent, the active fenced writer conditionally publishes a head that drops complete segment references, and a separately scheduled reclaimer deletes unreachable objects after a grace period while scrub finds orphan uploads.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#334455" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 18 9 0 18Z" fill="#087a51"/></marker>
    <style>.title{font:700 49px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.subtitle{font:400 23px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}.eye{font:700 18px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:1.2px;fill:#334455}.label{font:700 25px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.meta{font:400 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#667788}.mono{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334455}.small{font:600 18px Inter,ui-sans-serif,system-ui,sans-serif;fill:#334455}.white{fill:#fff}.pale{fill:#d9e2e7}</style>
  </defs>
  <rect width="1600" height="880" fill="#f7f7f4"/>
  <text x="64" y="70" class="title">Expire references first; delete objects later</text>
  <text x="64" y="112" class="subtitle">Logical retention is a fenced catalog commit. Physical reclamation follows on its own schedule.</text>
  <rect x="54" y="148" width="1492" height="670" rx="28" fill="#fff" filter="url(#shadow)"/>

  <text x="84" y="198" class="eye">1 · RECORD INTENT</text>
  <rect x="84" y="228" width="380" height="242" rx="22" fill="#fff7e8" stroke="#e2c84e" stroke-width="3"/>
  <text x="274" y="278" class="label" text-anchor="middle">Retention request</text>
  <rect x="130" y="310" width="288" height="80" rx="14" fill="#fff" stroke="#e2c84e" stroke-width="2"/>
  <text x="274" y="344" class="mono" text-anchor="middle">policy_version = 42</text>
  <text x="274" y="374" class="mono" text-anchor="middle">before_lsn = 650</text>
  <text x="274" y="430" class="meta" text-anchor="middle">reader visibility unchanged</text>
  <path d="M464 349H528" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="554" y="198" class="eye">2 · PUBLISH NEW REACHABILITY</text>
  <rect x="554" y="228" width="492" height="242" rx="22" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="800" y="278" class="label" text-anchor="middle">Active writer applies through fence</text>
  <rect x="596" y="310" width="180" height="96" rx="14" fill="#fff2ed" stroke="#d97857" stroke-width="2"/>
  <text x="686" y="345" class="mono" text-anchor="middle">old head</text>
  <text x="686" y="378" class="meta" text-anchor="middle">oldest = 0</text>
  <path d="M776 358H824" fill="none" stroke="#087a51" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="850" y="310" width="154" height="96" rx="14" fill="#334455"/>
  <text x="927" y="345" class="mono pale" text-anchor="middle">new head</text>
  <text x="927" y="378" class="meta pale" text-anchor="middle">oldest = 600</text>
  <text x="800" y="444" class="meta" text-anchor="middle">whole-segment refs below the floor disappear</text>
  <path d="M1046 349H1110" fill="none" stroke="#087a51" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="1136" y="198" class="eye">3 · RECLAIM LATER</text>
  <rect x="1136" y="228" width="376" height="242" rx="22" fill="#eef3f5" stroke="#c8d2d7" stroke-width="3"/>
  <text x="1324" y="278" class="label" text-anchor="middle">Lifecycle worker</text>
  <text x="1324" y="324" class="mono" text-anchor="middle">observe unreachable</text>
  <text x="1324" y="358" class="mono" text-anchor="middle">wait grace period</text>
  <text x="1324" y="392" class="mono" text-anchor="middle">delete bounded batch</text>
  <text x="1324" y="440" class="meta" text-anchor="middle">scrub never-published orphans</text>

  <line x1="84" y1="526" x2="1512" y2="526" stroke="#d7e0e3" stroke-width="3"/>
  <text x="84" y="571" class="eye">SEGMENT OBJECTS</text>
  <rect x="84" y="604" width="198" height="104" rx="16" fill="#fff2ed" stroke="#d97857" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="183" y="645" class="mono" text-anchor="middle">LSN 0–199</text><text x="183" y="681" class="meta" text-anchor="middle">unreachable</text>
  <rect x="304" y="604" width="198" height="104" rx="16" fill="#fff2ed" stroke="#d97857" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="403" y="645" class="mono" text-anchor="middle">LSN 200–399</text><text x="403" y="681" class="meta" text-anchor="middle">unreachable</text>
  <rect x="524" y="604" width="198" height="104" rx="16" fill="#fff2ed" stroke="#d97857" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="623" y="645" class="mono" text-anchor="middle">LSN 400–599</text><text x="623" y="681" class="meta" text-anchor="middle">unreachable</text>
  <rect x="744" y="604" width="198" height="104" rx="16" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="843" y="645" class="mono" text-anchor="middle">LSN 600–799</text><text x="843" y="681" class="meta" text-anchor="middle">retained whole</text>
  <rect x="964" y="604" width="198" height="104" rx="16" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="1063" y="645" class="mono" text-anchor="middle">LSN 800–999</text><text x="1063" y="681" class="meta" text-anchor="middle">reachable</text>
  <rect x="1184" y="604" width="328" height="104" rx="16" fill="#e9f8ef" stroke="#5bcf80" stroke-width="3"/>
  <text x="1348" y="645" class="mono" text-anchor="middle">LSN 1,000 → tail</text><text x="1348" y="681" class="meta" text-anchor="middle">reachable</text>

  <rect x="84" y="750" width="1428" height="42" rx="12" fill="#dff3e7"/>
  <text x="798" y="778" class="small" text-anchor="middle">A reader that already found an old object gets a grace period before deletion.</text>
</svg>
